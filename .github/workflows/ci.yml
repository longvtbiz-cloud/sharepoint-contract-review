name: CI

on:
  pull_request:
  push:
    branches:
      - "**"

jobs:
  validate:
    name: Validate governance scaffold
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile Python modules
        env:
          PYTHONIOENCODING: utf-8
          PYTHONUTF8: "1"
        run: python -m compileall main.py governance scripts tests

      - name: Run deterministic smoke validation
        env:
          PYTHONIOENCODING: utf-8
          PYTHONUTF8: "1"
        run: python scripts/governance_cli.py validate

      - name: Export integration artifacts
        env:
          PYTHONIOENCODING: utf-8
          PYTHONUTF8: "1"
        run: python scripts/governance_cli.py artifacts --output-dir /tmp/governance-artifacts

      - name: Run pytest
        env:
          PYTHONIOENCODING: utf-8
          PYTHONUTF8: "1"
        run: pytest

      - name: Build runtime container
        run: docker build -t enterprise-partner-governance-platform:ci .
